# Glasshouse default agent policy.
#
# This is the policy a new org starts with, and it is meant to be safe to ship
# unchanged: reads and drafts run quietly, local edits run and stay undoable,
# anything that leaves the machine or can't be undone asks first, and security
# settings are never touched by agents.
#
# Keys under `tiers` are action patterns ("files.write", "files.*", "*") and
# must be quoted, because TOML treats unquoted dots as nested tables.

version = 1

[org]
# Highest label any agent may open. Confidential content needs an explicit
# group or agent rule plus a local or private model (see the PRD data labels).
max_label = "internal"
# An unanswered Ask holds the agent; after this the task pauses (DA-13).
approval_timeout_secs = 900

[org.tiers]
"files.list" = "auto"
"files.read" = "auto"
"files.write" = "notify"
"files.move" = "notify"
"files.delete" = "ask"
"mail.list" = "auto"
"mail.account" = "auto"
"mail.read" = "auto"
"mail.draft" = "auto"
"mail.send" = "ask"
# Filing mail in Inbox, Archive, Junk or Trash runs and stays undoable: undo
# moves it back on the mail server too (ADR 0037).
"mail.move" = "notify"
# Connecting mail takes the person's mail password: theirs to type, in Mail
# (its [[app]] below), never an agent's whatever its rules say (ADR 0037).
"mail.connect" = "never"
# Calendar (NV-3): reading is quiet; holds and events on the user's own
# calendar run and stay undoable; deleting one and sending invitations ask.
"calendar.list" = "auto"
"calendar.read" = "auto"
"calendar.hold" = "notify"
"calendar.create" = "notify"
"calendar.update" = "notify"
"calendar.delete" = "ask"
"calendar.invite" = "ask"
"records.save_draft" = "notify"
"records.submit" = "ask"
"payments.*" = "ask"
# IT self-service (AE-4): checks read quietly, a cache cleanup runs and stays
# undoable, a service restart and a help desk ticket ask first.
"system.network.check" = "auto"
"system.storage.check" = "auto"
"system.performance.check" = "auto"
"system.storage.clean_cache" = "notify"
"system.service.restart" = "ask"
"helpdesk.ticket.create" = "ask"
# Catalog first (GA-2): looking up what IT approved reads only. Installing
# or removing what it makes available (the Store, DV-11) runs and stays
# undoable: it changes only which of those the person sees.
"catalog.search" = "auto"
"catalog.list" = "auto"
"catalog.install" = "notify"
"catalog.remove" = "notify"
# Looking colleagues up in the org's directory (AD-1) reads only.
"people.search" = "auto"
# Device settings (UX-1): reading them, and the person changing one IT left
# to them in the Settings app. Agents may read them; changing one is not in
# any agent's allowed actions.
"settings.list" = "auto"
"settings.set" = "auto"
# Chat (CF-91, ADR 0030): reading the person's conversations is quiet;
# posting and making a channel leave the machine and can't be taken back,
# so they ask. What the person types in Chat itself is the [[app]] below.
"chat.list" = "auto"
"chat.read" = "auto"
"chat.post" = "ask"
"chat.create" = "ask"
# Chat's everyday features (CF-92, ADR 0030 C4a): searching reads, on this
# computer; reactions, edits, deletes, pins and topics reach everyone in the
# conversation, so an agent asks. Drafts and what the person wants to hear
# of change only the person's own settings on this computer; no agent's
# allowed actions name them.
"chat.search" = "auto"
"chat.react" = "ask"
"chat.edit" = "ask"
"chat.delete" = "ask"
"chat.pin" = "ask"
"chat.topic" = "ask"
# Adding people to a channel or group gives them its whole history (ADR 0030
# C2), so an agent asks.
"chat.members" = "ask"
"chat.draft" = "auto"
"chat.notify" = "auto"
# Artifacts (AR-1, ADR 0033): pages shared in the org's sealed shared space.
# Reading what was shared with the person is quiet; sharing, a new version,
# a comment or a resolve reach other people and can't be taken back, so
# they ask. What the person does in the Artifacts app is its [[app]] below.
"artifact.list" = "auto"
"artifact.read" = "auto"
"artifact.share" = "ask"
"artifact.update" = "ask"
"artifact.comment" = "ask"
"artifact.resolve" = "ask"
# Docs (DC, ADR 0035): reading a doc shared with the person is quiet; making
# one, writing into it, a comment, a resolve, a named version or a change of
# who may edit reach other people, so they ask. What the person types in the
# Docs app is its [[app]] below; their typing is live edits, not actions.
"doc.list" = "auto"
"doc.read" = "auto"
"doc.open" = "auto"
"doc.create" = "ask"
"doc.write" = "ask"
"doc.comment" = "ask"
"doc.resolve" = "ask"
"doc.version" = "ask"
"doc.roles" = "ask"
# Skills (SK, ADR 0034): reading is quiet; drafts and eval results stay on
# this computer; sharing, proposing and merging reach other people, so they
# ask. Only the skill-evals agent's results are kept.
"skill.list" = "auto"
"skill.read" = "auto"
"skill.draft" = "auto"
"skill.results" = "auto"
"skill.share" = "ask"
"skill.propose" = "ask"
"skill.merge" = "ask"
# Glasshouse meetings (CF-21, ADR 0030) are for people: no agent joins one or
# lists them, whatever its rules allow, and a group or agent rule that names
# them doesn't validate. The person joins in Meet and sees their meetings in
# Calendar, by those apps' own [[app]] tiers below.
"meet.*" = "never"
"security.*" = "never"
"vendors.bank_details.*" = "never"
"data.export_bulk" = "never"

# Plain-language names for rules, shown on handoff cards and in "Can't touch"
# when no installed app names the action itself.
[names]
"security.*" = "Security settings"
"vendors.bank_details.*" = "Vendor bank details"
"data.export_bulk" = "Exporting data in bulk"
"meet.*" = "Glasshouse meetings"
"payments.*" = "Payments"
"records.submit" = "Posting or submitting records"

# What the IT agent may fix beyond its checks and cache cleanup (AE-4).
# Services it may restart, by rc.d name; anything else opens a ticket.
[fixes]
services = ["cron", "ntpd", "openvpn", "cupsd"]

# Models (DP-2, ADR 0018). A new org approves none, so no agent can call a
# model until IT lists one here and allows `model.complete` to an agent.
# Amazon Bedrock in the org's own AWS account is the default provider. Its
# temporary credentials, and any API keys, go in model-secrets.toml (see
# glassd.toml), never here. For example:
#
# [models]
# default = "claude-bedrock"         # for public and internal data
# [models.routes]                    # in order; the rest take over on an outage
# confidential = ["claude-bedrock"]  # confidential data goes only where a route says
# [models.redact]                    # secrets are always redacted; this adds PII
# pii = ["email", "us-ssn", "card-number"]
#
# [[models.provider]]
# id = "bedrock"
# kind = "bedrock"
# name = "Amazon Bedrock"
# region = "us-east-1"
#
# [[models.model]]
# id = "claude-bedrock"
# provider = "bedrock"
# model = "<Bedrock model or inference profile id>"
# name = "Claude"
# usd_per_mtok_in = 3.0
# usd_per_mtok_out = 15.0
#
# Groups and agents can narrow the list: `models = ["claude-bedrock"]`.

# Profiles (role-based delivery, AD-7): which apps people get is policy.
# Everyone gets the Browser (CF-15), Mail, Calendar, the Store (what the
# org's catalog offers them, DV-10), Activity Monitor (what is using their
# own computer, UI-9) and Terminal (their own shell, UI-8); IT's tools for
# managing computers, the admin console first, are in the profiles of IT's
# role only, and glassd opens them for no one else. In a managed fleet the
# directory fills `it-admins` (SCIM, AD-1).
[[group]]
name = "everyone"
agents = ["it-agent", "invoice-demo", "containment-probe", "claude-code", "skill-evals"]
apps = ["browser", "mail", "calendar", "chat", "artifacts", "docs", "meet", "store", "settings", "activity-monitor", "terminal"]

[[group]]
name = "it-admins"
apps = ["console"]

# What the person types in Chat doesn't ask: they just typed it. These are
# the Chat app's own rules, so a group that sets "chat.post" = "ask" still
# asks its members for every message. A tier lowered here is to be held
# only for a call the person just made in Chat's window (presence, ADR
# 0030 slice C2); until that lands, nothing reaches a pilot org.
[[app]]
id = "chat"
tiers = { "chat.post" = "auto", "chat.create" = "auto", "chat.react" = "auto", "chat.edit" = "auto", "chat.delete" = "auto", "chat.pin" = "auto", "chat.topic" = "auto", "chat.draft" = "auto", "chat.notify" = "auto", "chat.members" = "auto" }

# What the person does in Artifacts is theirs, as in Chat (ADR 0033), and
# waits on the same presence check before a pilot org.
[[app]]
id = "artifacts"
tiers = { "artifact.share" = "auto", "artifact.update" = "auto", "artifact.comment" = "auto", "artifact.resolve" = "auto" }

# In Mail the person connects their mail with their password, and files
# the mail they're reading (ADR 0037). Sending still asks: presence comes
# with ADR 0030 slice C2.
[[app]]
id = "mail"
tiers = { "mail.connect" = "auto", "mail.move" = "auto" }

# And in Docs, with the same presence check to come.
[[app]]
id = "docs"
tiers = { "doc.create" = "auto", "doc.comment" = "auto", "doc.resolve" = "auto", "doc.version" = "auto", "doc.roles" = "auto" }

[[app]]
id = "skills"
tiers = { "skill.share" = "auto", "skill.propose" = "auto", "skill.merge" = "auto" }

# The person joins a meeting in Meet, which fetches its media keys and
# leaves (CF-21); Calendar lists the meetings they're in, with Join. The
# org's "meet.*" = "never" holds for every other app.
[[app]]
id = "meet"
tiers = { "meet.list" = "auto", "meet.join" = "auto", "meet.keys" = "auto", "meet.leave" = "auto" }

[[app]]
id = "calendar"
tiers = { "meet.list" = "auto" }

# IT self-service (AE-4): diagnoses this computer and fixes what's on IT's
# list. The only agent allowed the system actions, which glassd runs with its
# own privileges; it can't name a path or a command, only pick an action.
[[agent]]
id = "it-agent"
allowed_actions = ["system.*", "helpdesk.ticket.create"]

# Scripted demo agent used to show delegation, approvals and undo end to end
# before model-backed agents land.
[[agent]]
id = "invoice-demo"
allowed_actions = ["files.*", "mail.*"]

# The user's own Claude Code, connected through glass-mcp (HX-1): Take over on
# an ended task carries on there. It reads the person's chat quietly and asks
# before it posts (CF-91). Before it builds something it checks the
# org's catalog for an approved app that already does it (GA-2), then the
# apps the person can remix, and it makes an app of theirs only after both
# (apps.*, ADR 0032: checked and kept by glassd, theirs alone). Its calls go
# through the same tiers, audit and undo as any agent's. Confidential data
# stays out of harnesses that send model traffic to their own provider (HX-7).
[[agent]]
id = "claude-code"
allowed_actions = ["files.*", "mail.*", "calendar.*", "catalog.search", "people.search", "settings.list", "chat.list", "chat.read", "chat.post", "chat.search", "chat.react", "artifact.*", "doc.list", "doc.read", "doc.create", "doc.write", "doc.comment", "skill.list", "skill.read", "skill.draft", "skill.share", "skill.propose", "skill.merge", "apps.*"]
max_label = "internal"

# Runs a skill's evals (SK-5, ADR 0034): reads the skill, asks the model
# through the gateway, which routes by the skill's label, and keeps the
# scores on this computer. Nothing else.
[[agent]]
id = "skill-evals"
allowed_actions = ["skill.read", "skill.results", "model.complete"]

# Diagnostics agent that tries to break out of its sandbox and reports what it
# could reach. Grants it nothing beyond reading its task scope.
[[agent]]
id = "containment-probe"
allowed_actions = ["files.list", "files.read"]

[[label]]
path = "/home/*/Finance"
label = "confidential"

[[label]]
path = "/home/*/Private"
label = "restricted"
