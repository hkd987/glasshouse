[package]
name = "glass-gateway-providers"
description = "Everything that leaves the machine: Anthropic Messages and Amazon Bedrock model calls, managed settings from the org's admin console, and the person's mail over IMAP and SMTP submission, in TLS with the base system's OpenSSL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

# The only crate with an HTTP and TLS stack (ADR 0018). Keep it that way:
# nothing else may depend on native-tls, and only glass-crypto, for sealing
# (ADR 0030), on OpenSSL itself (tools/check-layers.py).
[dependencies]
glass-crypto.workspace = true
glass-gateway.workspace = true
glass-managed.workspace = true
glass-policy.workspace = true
hex.workspace = true
httparse.workspace = true
native-tls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
# The mox test harness (`mail::testing`), for other crates' tests.
tempfile = { workspace = true, optional = true }

[features]
# `mail::testing`: a `mox localserve` per test (ADR 0037, EM0). Tests only.
testing = ["dep:tempfile"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
