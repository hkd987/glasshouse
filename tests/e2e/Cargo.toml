[package]
name = "glass-e2e"
description = "End-to-end scenarios against a live glassd: run inside the FreeBSD VM (or against a dev host daemon)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
glass-api.workspace = true
glass-app-routines.workspace = true
glass-audit.workspace = true
glass-platform.workspace = true
glass-policy.workspace = true
glass-rpc.workspace = true
glass-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true

[[bin]]
name = "glass-e2e"
path = "src/main.rs"

# Claude Code's headless mode, as far as glass-claude-runner needs it, with
# no model and no account (ADR 0042).
[[bin]]
name = "glass-fake-claude"
path = "src/bin/fake_claude.rs"

# wpa_supplicant's control socket with networks in the air and no radio,
# for the development host and the apps' tests (CF-12, ADR 0059).
[[bin]]
name = "glass-fake-wpa"
path = "src/bin/fake_wpa.rs"

[lints]
workspace = true
