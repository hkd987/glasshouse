# What runs on every change: `make ci`, split into jobs that share nothing so
# they run side by side. Each job is the same make targets a person runs on
# their own machine (CLAUDE.md, docs/dev/testing.md); nothing is checked here
# that can't be checked there.
#
# Not here, because hosted runners have no KVM: the FreeBSD VM suite
# (`make e2e-vm`), the hardware matrix and the soak. Run those before a
# change to containment, the broker, undo or the audit log is merged.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Nothing is rebuilt after an edit here, and the caches are gigabytes.
  CARGO_INCREMENTAL: "0"
  # A check whose tool is missing fails; on a laptop it says so and passes
  # (mox for the mail tests, Java for the models).
  GLASS_REQUIRE_TOOLS: "1"

jobs:
  core:
    name: lint, tests, models
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Room on the disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Host packages
        # Seconds when the package servers answer; see ci-packages.sh.
        timeout-minutes: 15
        run: |
          tools/dev/ci-packages.sh \
            clang lld shellcheck python3 python3-pil xz-utils zstd curl \
            libssl-dev pkg-config libxkbcommon-dev libpixman-1-dev default-jre-headless
      - name: The pinned Rust toolchain
        run: rustup show
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
      - name: FreeBSD downloads and test tools
        uses: actions/cache@v4
        with:
          path: |
            build/cache
            build/tools
          key: tools-${{ hashFiles('os/freebsd/release.env', 'tools/dev/mox.sh', 'tools/dev/tla.sh') }}
      - name: The FreeBSD sysroot (the FreeBSD clippy links against it)
        run: make freebsd-sysroot
      - name: mox, for the mail tests
        run: tools/dev/mox.sh build
      - name: Licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      # Ubuntu 24.04 keeps user namespaces from programs that have no
      # AppArmor profile. The console's confined bundler and agents'
      # computers are made of them (unshare), on the hosts they run on too.
      - name: User namespaces, as on the hosts this runs on
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make lint-all
      # Every test binary, whichever fails: one run says all that is wrong
      # here, where a run stopped at the first told one thing at a time.
      - run: make test TEST_ARGS=--no-fail-fast
        if: success() || failure()
      - run: make tla
        if: success() || failure()

  shell:
    name: desktop shell
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Host packages
        # Seconds when the package servers answer; see ci-packages.sh.
        timeout-minutes: 15
        run: |
          tools/dev/ci-packages.sh \
            clang lld xz-utils zstd curl libssl-dev pkg-config libxkbcommon-dev libpixman-1-dev
      - name: The pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shell
          workspaces: shell
      - name: FreeBSD downloads
        uses: actions/cache@v4
        with:
          path: build/cache
          key: freebsd-${{ hashFiles('os/freebsd/release.env') }}
      - name: The FreeBSD sysroot, with the desktop's libraries
        run: |
          make freebsd-sysroot
          # No VM here to install them in first: fetched, then unpacked.
          os/freebsd/scripts/ports.sh fetch libxkbcommon pixman
          os/freebsd/scripts/ports.sh sysroot libxkbcommon pixman
      - run: make shell-lint
      - run: make shell-test

  # The Agents desktop app is a workspace of its own (agents-app/). Nothing
  # built it here, so nothing noticed when a dependency added to a crate it
  # shares with the main workspace left its lockfile stale, or would have
  # noticed its code no longer compiling.
  agents-app:
    name: Agents desktop app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Host packages
        # Seconds when the package servers answer; see ci-packages.sh.
        timeout-minutes: 15
        run: |
          tools/dev/ci-packages.sh clang lld libssl-dev pkg-config
          # WebKitGTK and the tray's libraries: its window on Linux.
          sudo make agents-app-deps
      - name: The pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: agents-app
          # It builds into the repository's target folder (--target-dir).
          workspaces: "agents-app -> ../target"
      - run: make agents-app-lint
      - run: make agents-app-test
        if: success() || failure()

  web:
    name: web apps and admin console
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Room on the disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Host packages
        # Seconds when the package servers answer; see ci-packages.sh.
        timeout-minutes: 15
        run: |
          tools/dev/ci-packages.sh \
            clang lld python3 xz-utils curl libssl-dev pkg-config
      - name: The pinned Rust toolchain
        run: rustup show
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web
      - name: The browser the suites drive, where they look for it
        run: |
          sudo mkdir -p /opt/pw-browsers
          sudo chown "$USER" /opt/pw-browsers
          make apps/node_modules
          cd apps && PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright install --with-deps chromium
      # Ubuntu 24.04 keeps user namespaces from programs that have no
      # AppArmor profile. The console's confined bundler and agents'
      # computers are made of them (unshare), on the hosts they run on too.
      - name: User namespaces, as on the hosts this runs on
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make apps-test
      - run: make console-test
        if: success() || failure()
      # Meetings' media through the relay. Left out of what CI ran, one of
      # its tests failed every run and nobody saw.
      - run: make meet-test
        if: success() || failure()
      # A suite that fails here and nowhere else: what glassd, the bridge and
      # the page said, since nobody can go and look.
      - name: What the dev host logged
        if: failure()
        run: |
          # In the checkout's build folder, or where the suite put its
          # state when the checkout is too deep for an agent's socket.
          for log in build/apps-e2e/*.log build/console-e2e/*.log build/console-e2e/*/*.log /tmp/glass-e2e-*/*/*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 200 "$log"
            echo "::endgroup::"
          done
          for page in apps/e2e/results/artifacts/*/error-context.md apps/e2e/results/console-artifacts/*/error-context.md; do
            [ -f "$page" ] || continue
            echo "::group::$page"
            head -c 20000 "$page"
            echo "::endgroup::"
          done
