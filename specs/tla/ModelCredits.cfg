\* Credits as the code runs them now (ADR 0052): two payments relayed and
\* our operator's grant, three calls with two permits, two answers lost and
\* one failed save.
CONSTANTS
    Sessions = {s1, s2}
    Calls = {c1, c2, c3}
    MaxInFlight = 2
    MaxLost = 2
    MaxSaveFails = 1
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ADR0040_EachPaymentGrantedOnce
    ADR0039_TheLimitIsNoMoreThanWasBought
    ADR0040_DeliveredIsKept
    ADR0039_TheLimitIsTheGrants
    ADR0039_SpendWithinCredits
    ADR0039_TheConsoleNeverOverstatesSpend
    BilledTwiceOnlyAfterALostAnswer
