\* A meeting's media keys as the code runs them now (ADR 0052): two
\* people, three joins between them (one drops out, leaves or comes
\* back), one request out of reach, four keys. Three people (each joining
\* once) check in minutes, not seconds: run by hand when the code changes.
CONSTANTS
    People = {a, b}
    MaxKeys = 4
    MaxJoins = 3
    MaxFails = 1
    Asks = 1
    Fixed = TRUE
SYMMETRY Alike
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    CF21_WhoLeftCantOpenWhatFollows
    CF21_EveryoneHearsEveryone
    CF21_InTheCallMeansSeated
    CF21_NoKeyOutlivesTheCall
