\* An agent's task: two concurrent Ask-tier calls of one action, answers,
\* the timeout, two presses of the tile's buttons, the agent exiting, and
\* the machine sleeping and waking along the way.
CONSTANTS
    Calls = {c1, c2}
    App = FALSE
    MaxOps = 2
    Sleeps = TRUE
SYMMETRY Symmetry
\* The model comes to rest once the task has ended.
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    DA11_RunsOnlyApproved
    DA11_GrantsComeFromApprovals
    PA2_NothingOutlivesTheTask
    AW12_NeedsYouWhileAsked
    PM5_NothingRunsAsleep
PROPERTIES
    EndedStaysEnded
    NothingRunsAfterTheEnd
    AnsweredOnce
