\* A transcribed meeting's lines as the code sends them now (ADR 0052):
\* five lines, two of them asking the agent, the server out of reach
\* twice, two answers lost.
CONSTANTS
    N = 5
    AskLines = {2, 4}
    MaxOutages = 2
    MaxLost = 2
    Fixed = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ADR0045_EachLineOnce
    ADR0045_InOrder
    ADR0045_ARequestStartsOneTask
    ADR0045_NothingSaidIsLost
