\* A kernel patch tried in a boot environment of its own, as the code runs it
\* (ADR 0057): a good patch, one that panics as the computer starts, one that
\* fails glassd's check, one that panics or hangs once in use, or one that
\* hangs as the computer wakes; two restarts, power cuts or glassd restarts
\* at any step; sleep; IT taking back its trust; agents writing records
\* meanwhile.
CONSTANTS
    MaxTrials = 2
    MaxRestarts = 2
    MaxRecords = 1
    Probation = 2
    Resumes = 1
    MaxSleeps = 1
    Old = {}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ADR0057_TheComputerAlwaysStarts
    ADR0057_KeptOnlyAfterItsProbation
    ADR0057_NoPatchKeptThatBreaksWaking
    ADR0057_AWatchdogOnATrial
    ADR0057_APatchTheWatchdogResetIsNeverKept
    ADR0057_ACrashOnProbationGoesBack
    ADR0057_NoPatchKeptOnceItsTrustIsGone
    ADR0057_NeverStartsAHalfWrittenEnvironment
    AU1_NoRecordLostToAnEnvironment
PROPERTIES
    ADR0057_ATrialEnds
    ADR0057_ACrashOnProbationEndsIt
    ADR0057_AnUndoFinishes
    ADR0057_AHangOnATrialEndsByItself
CHECK_DEADLOCK FALSE
