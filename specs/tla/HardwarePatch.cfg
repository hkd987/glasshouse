\* A kernel patch tried in a boot environment of its own, as the code runs it
\* (ADR 0057): any of a good, panicking or failing patch; two restarts or
\* power cuts at any step; agents writing records meanwhile.
CONSTANTS
    MaxTrials = 2
    MaxRestarts = 2
    MaxRecords = 3
    Old = {}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ADR0057_TheComputerAlwaysStarts
    ADR0057_OnlyAConfirmedPatchIsKept
    ADR0057_NeverStartsAHalfWrittenEnvironment
    AU1_NoRecordLostToAnEnvironment
PROPERTIES
    ADR0057_ATrialEnds
CHECK_DEADLOCK FALSE
