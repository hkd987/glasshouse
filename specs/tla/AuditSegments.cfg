\* The audit log in segments as the code runs it now (ADR 0053): four
\* records, closed into segments and removed under the retention rule at any
\* point, glassd stopping twice at any step, verify reading beside it twice.
CONSTANTS
    MaxRecs = 4
    MaxCrashes = 2
    MaxPasses = 2
    Old = {}
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    AU2_TheLogOnDiskAlwaysVerifies
    AU3_OnlyRecordsPastTheRuleGo
    AU2_VerifyReportsNoBreakThatIsntThere
