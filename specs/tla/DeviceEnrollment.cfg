    MaxRestarts = 2
    Fixed = TRUE
SPECIFICATION Spec
\* A computer refused (removed, or its key damaged before the fix) can be left
\* with nothing to do: the invariants say whether it should have been.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ADR0030_ARemovedComputerStaysRemoved
    DV1_NothingReleasedAfterRemovalReachesIt
    AD4_TheFleetIsComputersThatRegistered
    ADR0030_EnrollmentSurvivesARestart
