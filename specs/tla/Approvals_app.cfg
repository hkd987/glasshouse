\* An app session: its timed-out asks don't pause it; no take over.
CONSTANTS
    Calls = {c1, c2}
    App = TRUE
    MaxOps = 2
    Sleeps = TRUE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    DA11_RunsOnlyApproved
    DA11_GrantsComeFromApprovals
    PA2_NothingOutlivesTheTask
    AW12_NeedsYouWhileAsked
    PM5_NothingRunsAsleep
PROPERTIES
    EndedStaysEnded
    NothingRunsAfterTheEnd
    AnsweredOnce
