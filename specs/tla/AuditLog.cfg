\* The audit log as the code writes and reads it now (ADR 0053): a read
\* and a change by agents of two tasks, the disk filling once, glassd
\* stopping once mid-write, a task's records asked for twice, and verify
\* and the console's report beside them.
CONSTANTS
    Calls = {r, w}
    Reads = {r}
    ReadTask = t1
    OtherTask = t2
    MaxFull = 1
    MaxCrashes = 1
    MaxViews = 2
    Old = {}
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    AU2_OnlyTheLastLineCanBeUnfinished
    AU2_VerifyNeverCallsAGoodLogCorrupt
    AU2_TheReportReadsAGoodLog
    AU3_ATaskHasEveryRecordOnce
    AU1_WhatRanIsRecorded
    AU1_NoUnrecordedReadReachesTheAgent
    AU1_NothingRunsWhileTheLogIsDown
