\* Read state as the code runs it now (ADR 0051): one message, two folders,
\* every interleaving of syncs, marks, moves, the phone and the network,
\* with two moves and one undo. (Two moves, one undo and one change of
\* UIDVALIDITY together: 6.7 million states, about 4 minutes; checked by
\* hand, split here and in _reset to keep `make tla` quick.)
CONSTANTS
    Msgs = {1}
    Folders = {"Inbox", "Archive"}
    MaxMoves = 2
    MaxResets = 0
    MaxUndos = 1
    Fixes = {"found", "validity", "markBack", "clearWaiting", "moveLocked",
             "pushBeforeMove", "undoMarkers", "moveBackFailure", "heal"}
SPECIFICATION Spec
INVARIANTS
    EM3_ReadAsTheServerHasIt
    EM3_EveryMessageKept
    EM3_OnlyWhatTheServerHas
    ADR0050_MarksAreNeverLost
    ADR0050_NoPushToAnotherValidity
PROPERTIES
    AU21_UndoPutsBackReadState
    AU21_AnUndoIsWholeOrNotAtAll
