\* A task's containment as the code runs it now (ADR 0053): three tasks of
\* one person and a limit of two, stops at any step, and glassd crashing,
\* being stopped and the computer restarting under it, once each.
CONSTANTS
    Tasks = {t1, t2, t3}
    MaxLive = 2
    MaxCrashes = 1
    MaxReboots = 1
    MaxShutdowns = 1
    Old = {}
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    LiveLimitHolds
    PA1_AnAgentRunsOnlyInItsJail
    PA2_NothingOutlivesTheTask
    PA2_NothingOfAnEarlierRunOnceStarted
    AW11_AStoppedTaskNeverStartsItsAgent
    PA2_ACleanStopLeavesNoAgentRunning
    EP1_NoAgentStartsOnAChangedSystem
