\* Two patches over two files (the kernel, a module), every choice of what
\* each rewrites and what it was built on, kept and taken out in any order
\* (ADR 0057).
CONSTANTS
    Patches = {"a", "b"}
    Files = {"kernel", "module"}
    MaxEnvs = 4
    Old = {}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ADR0057_NoKeptFixLost
    ADR0057_NothingRunsOffTheRecord
CHECK_DEADLOCK FALSE
