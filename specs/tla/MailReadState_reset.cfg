\* Read state with a folder numbered afresh (a new UIDVALIDITY) at any
\* point among two moves, the phone and the network; no undo.
CONSTANTS
    Msgs = {1}
    Folders = {"Inbox", "Archive"}
    MaxMoves = 2
    MaxResets = 1
    MaxUndos = 0
    Fixes = {"found", "validity", "markBack", "clearWaiting", "moveLocked",
             "pushBeforeMove", "undoMarkers", "moveBackFailure", "heal"}
SPECIFICATION Spec
INVARIANTS
    EM3_ReadAsTheServerHasIt
    EM3_EveryMessageKept
    EM3_OnlyWhatTheServerHas
    ADR0050_MarksAreNeverLost
    ADR0050_NoPushToAnotherValidity
