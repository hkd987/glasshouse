\* Sending as the code runs it now (ADR 0051): two messages, two calls at
\* once (a task and the person's Mail app, say), the server out of reach
\* twice, one reply lost, four drafts.
CONSTANTS
    Msgs = {1, 2}
    Senders = {a, b}
    MaxDrafts = 4
    MaxOutages = 2
    LostReplies = 1
    Fixed = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    DP30_WhatCantLeaveWaitsInDrafts
    DP30_OneDraftAMessage
    DP30_SentOnceNeverTwice
