\* Routing, redaction and replays as the code runs them now (ADR 0052):
\* a task of each of two people at once, each reading once, p1's calling a
\* model twice and p2's once, one rewrite by a task or the person, and
\* one attempt that fails.
CONSTANTS
    Tasks = {t1, t3}
    Other = t3
    MaxCalls = 2
    MaxReads = 1
    MaxWrites = 1
    MaxFailures = 1
    KeepLabel = TRUE
    LabelWrites = TRUE
    RecheckRead = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    DP2_OnlyToModelsApprovedForWhatWasRead
    DP11_OnlyToModelsApprovedForItsOrigin
    DP3_PlaceholdersComeBackOnlyToTheirCall
    DP3_AReplayMeansWhatItSaid
    MP8_OnlyApprovedModels
    ADR0044_NeverDownWhileAStepUpIsThere
    BilledOnceUnlessAReplyWasLost
PROPERTIES
    DP10_ALabelStaysWithItsFile
