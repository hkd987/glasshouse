\* Chat's sync as the code runs it now (ADR 0052): a computer shared by
\* two people, one of whom starts Chat during the run, and a colleague
\* posting from hers; two syncs at once, two messages, one store that
\* can't be kept.
CONSTANTS
    MaxPosts = 2
    MaxSaveFails = 1
    Old = {}
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    CF91_NoMessageLost
    CF92_UnreadIsWhatWasntShown
    ShownWasKept
