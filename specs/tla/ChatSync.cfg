\* Chat's sync as the code runs it now (ADR 0052): a computer shared by
\* two people, one of whom starts Chat during the run, and a colleague
\* posting from hers; two syncs at once, two messages, one store that
\* can't be kept. No rule for how long chat is kept, the default
\* (ChatSync_rule.cfg has one).
CONSTANTS
    MaxPosts = 2
    MaxSaveFails = 1
    MaxPast = 0
    Old = {}
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    CF91_NoMessageLost
    CF92_UnreadIsWhatWasntShown
    CF61_WhatTheRuleRemovedStaysRemoved
    ShownWasKept
