\* An artifact as the code shares it now (ADR 0052): the owner's app and
\* an agent each update it once on the owner's computer, a colleague
\* comments, and comments are resolved and reopened from either computer.
CONSTANTS
    Callers = {"app", "agent"}
    MaxUpdates = 2
    MaxComments = 1
    MaxResolves = 2
    Old = {}
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    AR4_EachUpdateIsTheVersionItSays
    AR4_VersionsCountUp
    AR3_ACommentIsOnAVersionThatIsShown
    AR3_EveryoneSeesTheSameResolved
