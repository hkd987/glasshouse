\* An agent computer and two hosts that share only the store (ADR 0066), as
\* the code runs it now: wakes, sleeps, hosts cut off from the store, glassd
\* stopping and starting, and a host going away, twice between them.
CONSTANTS
    Hosts = {a, b}
    MaxSaves = 3
    MaxTerms = 5
    MaxCrashes = 2
    Old = {}
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTRAINT Bounded
INVARIANTS
    TypeOK
    NothingSavedOverAnotherHostsWork
    SureMeansHeld
    OneSureHostAtATime
    AwakeIsWhatTheRecordNames
