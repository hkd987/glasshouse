\* The versions of a person's apps and their choice (ADR 0051): two tasks,
\* two ids a remix can take, two steps a task, one undo.
CONSTANTS
    Tasks = {t1, t2}
    FirstId = m1
    SecondId = m2
    MaxSteps = 2
    MaxUndos = 1
    Turns = TRUE
SPECIFICATION Spec
INVARIANTS
    GA3_VersionsAreNeverOverwritten
    GA3_TheChoiceIsAVersionThatExists
    GA3_NoChoiceIsLost
    ADR0032_TwoRemixesAreTwoApps
