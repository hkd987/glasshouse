\* The versions of a person's apps and their choice (ADR 0051): two tasks,
\* two ids a remix can take, two steps a task, one undo. Versions past
\* keeping are removed (audit 5.3): the newest one is kept whatever its
\* age, and any in use within Keep, which is as far back as an undo goes.
CONSTANTS
    Tasks = {t1, t2}
    FirstId = m1
    SecondId = m2
    MaxSteps = 2
    MaxUndos = 1
    Turns = TRUE
    Newest = 1
    Keep = 1
    Reach = 1
    MaxClock = 2
    Old = {}
SPECIFICATION Spec
INVARIANTS
    GA3_VersionsAreNeverOverwritten
    GA3_TheChoiceIsAVersionThatExists
    GA3_NoChoiceIsLost
    ADR0032_TwoRemixesAreTwoApps
