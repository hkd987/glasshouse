\* From power on to a person's desktop, as the code runs now (ADR 0053,
\* ADR 0055):
\* first-run setup, signing in and out, glassd crashing and started again,
\* a power cut at any step, and the policy file changed once.
CONSTANTS
    MaxCuts = 1
    MaxCrashes = 1
    MaxEdits = 1
    Old = {}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ADR0021_OnlyAValidPolicyInForce
    ADR0021_LastGoodWasInForce
    ADR0021_RefusesOnlyWithNoGoodCopy
    PA2_NothingLeftWhenATaskStarts
    UX2_WhoSignsInHasTheirHome
    UX2_NoHomeWithoutItsAccount
    ADR0038_TheOwnerIsWhoSetItUp
PROPERTIES
    UX2_SetupFinishes
    ADR0031_GlassdLearnsWhoIsAtTheScreen
    ADR0021_TheScreenComes
    ADR0055_GlassdComesBackAfterACrash
