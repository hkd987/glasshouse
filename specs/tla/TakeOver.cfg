\* Take over and hand back as the code runs them now (ADR 0052): two take
\* overs and two hand backs at once, two steps of the agent, one edit of the
\* person's, a pause and a resume, and the task ending.
CONSTANTS
    TakeOvers = {t1, t2}
    HandBacks = {h1, h2}
    AgentSteps = 2
    PersonEdits = 1
    MaxPauses = 1
    MaxResumes = 1
    Fixed = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AU10_YourEditsAreYours
    AW20_AHoldForYouStaysHeld
    AW21_YourEditsJoinTheTask
    AW21_TheAgentRunsOnlyAfterAHandBack
    OneDriver
