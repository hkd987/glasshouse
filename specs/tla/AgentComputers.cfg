\* An agent's computer as the code runs it now (ADR 0066): two tasks writing
\* to it, its person taking the keyboard, sleeping and waking, and glassd
\* dying at any step, twice.
CONSTANTS
    Tasks = {t1, t2}
    MaxWrites = 1
    MaxCrashes = 2
    Old = {}
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NothingWrittenIsLost
    AsleepIsOffTheHost
    PA2_ATaskLeavesNoSocketOrProcess
    RunsOnlyOnAnAwakeComputer
    WakeAlwaysWorks
