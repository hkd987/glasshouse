\* The log takes records again once the disk has room, without glassd
\* restarting (ADR 0053): a read and a change, the disk filling once,
\* glassd stopping once.
CONSTANTS
    Calls = {r, w}
    Reads = {r}
    ReadTask = t1
    OtherTask = t2
    MaxFull = 1
    MaxCrashes = 1
    MaxViews = 0
    Old = {}
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
PROPERTIES
    AU1_TheLogRecovers
