\* A signed OS update installed as a boot environment of its own, as the code
\* runs it (ADR 0061): releases 1 and 2 offered, each signed or not by a
\* listed channel key and the OS key, starting or not, fixing or rebuilding
\* a kept kernel patch or not; two power cuts, restarts or glassd restarts
\* at any step.
CONSTANTS
    MaxVersion = 2
    MaxRestarts = 2
    Old = {}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    EP1_TheComputerAlwaysStarts
    EP1_OnlySignedImagesRun
    EP12_NoReplay
    ADR0061_NoKeptFixLost
    ADR0061_NeverStartsAHalfWrittenImage
PROPERTIES
    ADR0061_AnUpdateEnds
    EP1_ABadImageRollsBack
CHECK_DEADLOCK FALSE
