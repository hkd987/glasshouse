# AWS on this machine, for Glasshouse Agents development and tests
# (deploy/local/README.md). Start it with `make aws-local`, which waits
# until it's ready and writes build/local-aws/env.
#
# Both containers use the host's network and listen on 127.0.0.1 only, so
# nothing here is reachable from other machines, and the stand-in load
# balancer reaches the front on this machine's loopback address. (Docker
# Desktop: Settings > Resources > Network > Enable host networking.)
name: glasshouse-local-aws

x-image: &image motoserver/moto:5.1.20

services:
  # S3, KMS and Secrets Manager, in memory: stopping it forgets everything.
  moto:
    image: *image
    network_mode: host
    entrypoint: ["/usr/local/bin/moto_server", "-H", "127.0.0.1", "-p", "${GLASS_LOCAL_AWS_PORT:-7610}"]
    restart: unless-stopped

  # The instance metadata service, Marketplace metering, the load balancer
  # and its public keys (fake-aws.py), on the next four ports.
  fake-aws:
    image: *image
    network_mode: host
    entrypoint: ["python3", "-I", "/fake/fake-aws.py"]
    volumes:
      - ./fake-aws.py:/fake/fake-aws.py:ro
    environment:
      FAKE_AWS_PORT_BASE: "${GLASS_LOCAL_AWS_PORT:-7610}"
      FAKE_AWS_REGION: "${GLASS_LOCAL_AWS_REGION:-us-east-1}"
      FAKE_ALB_UPSTREAM: "${GLASS_LOCAL_AWS_FRONT:-http://127.0.0.1:7500}"
    depends_on: [moto]
    restart: unless-stopped
