# USB cameras (UVC): webcamd presents each as a V4L2 device as it attaches, for calls in the browser
# engine (ADR 0058). Cameras only: webcamd's own rules also take every USB device of no class.
notify 100 {
	match "system"		"USB";
	match "subsystem"	"INTERFACE";
	match "type"		"ATTACH";
	match "intclass"	"0x0e";
	match "intsubclass"	"0x01";
	action "/usr/local/etc/rc.d/webcamd start $cdev 2>/dev/null";
};
