# Glasshouse daemon configuration. See crates/bin/glassd/src/config.rs for
# every setting and its default.

control_socket = "/var/run/glasshouse/control.sock"
# Apps reach glassd here (ADR 0024): only the app methods, authorized by uid.
app_socket = "/var/run/glasshouse/apps.sock"
# Installed apps, each with the manifest.json glassd enforces (UI-5, DV-3).
apps_dir = "/usr/local/share/glasshouse/apps"
# The browser's settings from IT's policy (UX-1): glassd writes org.json in
# managed/ (locked) and recommended/ (defaults) here.
browser_policies = "/usr/local/etc/chromium/policies"
state_dir = "/var/db/glasshouse"
# When this file is absent the built-in default policy is enforced. Print it
# with `glassctl policy default`. If it doesn't validate, glassd enforces the
# last policy that did (kept in state_dir/policy/) and says why (ADR 0021).
policy = "/usr/local/etc/glasshouse/policy.toml"
max_live_tasks_per_user = 8
# Take over on an ended task carries on in this attended agent: the user's
# own Claude Code, connected through glass-mcp.
harness = "claude-code"
# Credentials for the model providers policy names (ADR 0018): root-owned,
# mode 600, or glassd refuses it. Not shipped; IT or its tooling writes it.
model_secrets = "/usr/local/etc/glasshouse/model-secrets.toml"

[sandbox]
backend = "jail"
agent_dirs = ["/usr/local/libexec/glasshouse"]

# The person comes first: agents start below their CPU priority, and each
# task's jail gets these limits for as long as it exists. Shares are of this
# machine; 0 turns a limit off. Resource limits need the machine booted with
# kern.racct.enable=1 (post-install.sh sets it). docs/dev/performance.md,
# "Under load", has the measurements behind these.
[sandbox.limits]
nice = 10
cpu_percent = 50
memory_percent = 25
read_mb_per_sec = 64
write_mb_per_sec = 32
max_processes = 256

[snapshots]
backend = "zfs"

# The agent catalog (AD-5): what IT has published to this machine. What each
# agent may do is set by policy, not here.

# The general desktop agent (AE-3, ADR 0041): a model chooses its steps
# from the tools policy gives it, and every step is a call like any other.
[[agent]]
id = "desktop-agent"
name = "Desktop agent"
version = "0.1"
description = "Does what you ask with the tools policy gives it: reads your files, mail and calendar, drafts, and asks before anything that changes or sends."
mode = "actions"
program = "/usr/local/libexec/glasshouse/glass-desktop-agent"
plan = [
  "Work out what you asked with an AI model IT approved",
  "Use the tools policy gives it, one step at a time",
  "Ask you before anything that changes or sends",
  "Tell you what it did and found",
]

[[agent]]
id = "it-agent"
name = "IT agent"
version = "0.2"
description = "Fixes this computer: network and VPN, storage and slowdowns, from IT's approved list. Opens a help desk ticket with diagnostics when it can't."
mode = "actions"
program = "/usr/local/libexec/glasshouse/glass-it-agent"
plan = [
  "Check the parts of this computer your problem points to",
  "Apply a fix from IT's approved list, undoable where it changes anything",
  "Ask you before restarting anything or opening a help desk ticket",
]

[[agent]]
id = "skill-evals"
name = "Skill evals"
version = "0.1"
description = "Runs a skill's evals and keeps the scores on this computer, so a change to a skill shows whether it is better."
mode = "actions"
program = "/usr/local/libexec/glasshouse/glass-skill-evals"
plan = [
  "Read the skill, and the change to it if there is one",
  "Ask the model each eval case, as many times as the evals say, through IT's approved models",
  "Grade the answers and keep the scores on this computer",
]

[[agent]]
id = "invoice-demo"
name = "Invoice demo"
version = "0.1"
description = "Scripted demo agent: reconciles invoices, writes a summary, drafts a note to AP and asks before reminding vendors."
mode = "actions"
program = "/usr/local/libexec/glasshouse/glass-demo-agent"
plan = [
  "Read every invoice in the folder you give it",
  "Write a reconciliation summary to the reports folder",
  "Draft a note to the AP team",
  "Ask you before emailing reminders to vendors with unpaid invoices",
]

# What users may change with a personal layer (TL-1); everything else is
# locked. `glassctl tailor invoice-demo` shows and changes them.
[[agent.customize]]
key = "flag_over"
title = "Flag invoices over (dollars)"
kind = "number"

[[agent.customize]]
key = "remind_vendors"
title = "Ask to remind vendors"
kind = "flag"
default = true

[[agent.customize]]
key = "instructions"
title = "Also do this"
kind = "instructions"

# The user's own Claude Code (HX-1). glassd starts nothing for it: the user
# connects Claude Code to the task's socket with glass-mcp, and every call
# goes through the same approvals, audit and undo as any agent's.
[[agent]]
id = "claude-code"
name = "Claude Code"
version = "1"
description = "Your own Claude Code session, connected to Glasshouse: it works through the same approvals, audit and undo as any agent."
mode = "actions"
attended = true
plan = [
  "Connect your Claude Code with the command shown",
  "Work through Glasshouse's actions, with the usual approvals",
  "Hand back when you're done",
]

[[agent]]
id = "containment-probe"
name = "Containment probe"
version = "0.1"
description = "Diagnostics: tries to read files, reach the network and see processes it shouldn't, then reports what it could reach."
mode = "actions"
program = "/usr/local/libexec/glasshouse/glass-probe"
plan = [
  "Try to read files outside the task",
  "Try to reach the network",
  "Try to see other processes",
  "Report the results",
]
