# Glasshouse daemon configuration. See crates/bin/glassd/src/config.rs for
# every setting and its default.

control_socket = "/var/run/glasshouse/control.sock"
state_dir = "/var/db/glasshouse"
# When this file is absent the built-in default policy is enforced. Print it
# with `glassctl policy default`.
policy = "/usr/local/etc/glasshouse/policy.toml"
max_live_tasks_per_user = 8
# Take over on an ended task carries on in this attended agent: the user's
# own Claude Code, connected through glass-mcp.
harness = "claude-code"

[sandbox]
backend = "jail"
agent_dirs = ["/usr/local/libexec/glasshouse"]

[snapshots]
backend = "zfs"

# The agent catalog (AD-5): what IT has published to this machine. What each
# agent may do is set by policy, not here.

[[agent]]
id = "it-agent"
name = "IT agent"
version = "0.1"
description = "Fixes this computer: network and VPN, storage and slowdowns, from IT's approved list. Opens a help desk ticket with diagnostics when it can't."
mode = "actions"
program = "/usr/local/libexec/glasshouse/glass-it-agent"
plan = [
  "Check the parts of this computer your problem points to",
  "Apply a fix from IT's approved list, undoable where it changes anything",
  "Ask you before restarting anything or opening a help desk ticket",
]

[[agent]]
id = "invoice-demo"
name = "Invoice demo"
version = "0.1"
description = "Scripted demo agent: reconciles invoices, writes a summary, drafts a note to AP and asks before reminding vendors."
mode = "actions"
program = "/usr/local/libexec/glasshouse/glass-demo-agent"
plan = [
  "Read every invoice in the folder you give it",
  "Write a reconciliation summary to the reports folder",
  "Draft a note to the AP team",
  "Ask you before emailing reminders to vendors with unpaid invoices",
]

# What users may change with a personal layer (TL-1); everything else is
# locked. `glassctl tailor invoice-demo` shows and changes them.
[[agent.customize]]
key = "flag_over"
title = "Flag invoices over (dollars)"
kind = "number"

[[agent.customize]]
key = "remind_vendors"
title = "Ask to remind vendors"
kind = "flag"
default = true

[[agent.customize]]
key = "instructions"
title = "Also do this"
kind = "instructions"

# The user's own Claude Code (HX-1). glassd starts nothing for it: the user
# connects Claude Code to the task's socket with glass-mcp, and every call
# goes through the same approvals, audit and undo as any agent's.
[[agent]]
id = "claude-code"
name = "Claude Code"
version = "1"
description = "Your own Claude Code session, connected to Glasshouse: it works through the same approvals, audit and undo as any agent."
mode = "actions"
attended = true
plan = [
  "Connect your Claude Code with the command shown",
  "Work through Glasshouse's actions, with the usual approvals",
  "Hand back when you're done",
]

[[agent]]
id = "containment-probe"
name = "Containment probe"
version = "0.1"
description = "Diagnostics: tries to read files, reach the network and see processes it shouldn't, then reports what it could reach."
mode = "actions"
program = "/usr/local/libexec/glasshouse/glass-probe"
plan = [
  "Try to read files outside the task",
  "Try to reach the network",
  "Try to see other processes",
  "Report the results",
]
