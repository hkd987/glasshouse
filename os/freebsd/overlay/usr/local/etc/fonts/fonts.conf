<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fonts for the browser engine (ADR 0027): the desktop's own, Geist and Geist Mono, which
     the shell draws with too. Each person's cache is in their home. -->
<fontconfig>
  <dir>/usr/local/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Geist</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Geist</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Geist Mono</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Geist</family></prefer>
  </alias>
</fontconfig>
