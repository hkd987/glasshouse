# Glasshouse's own logs, kept to a size (newsyslog.conf(5); cron runs
# newsyslog hourly). Neither was rotated: both grew for as long as the
# computer was used, on the pool whose filling stops every agent.
#
# Past 10 MB a log is moved aside and compressed, five kept. daemon(8) holds
# each log open (rc.d/glassd, rc.d/glasshouse_greeter start it with -H), so
# it is told to open the new one: SIGHUP to the supervisor, which is whose
# pid these files hold. glassd and the sign-in screen never see the signal.
#
# logfilename                 mode count size  when flags pid_file
/var/log/glassd.log           600  5     10240 *    BCX   /var/run/glassd_supervisor.pid
/var/log/glass-greeter.log    600  5     10240 *    BCX   /var/run/glasshouse_greeter_supervisor.pid
