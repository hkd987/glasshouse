[workspace]
resolver = "3"
# Layering (enforced by `make check-layers`, see docs/repo-layout.md):
#   crates/lib  reusable libraries; may depend only on other lib crates
#   crates/svc  service implementations hosted by daemons; lib + svc
#   crates/bin  executables; anything
#   tests/*     end-to-end suites; anything
members = [
    "crates/lib/*",
    "crates/svc/*",
    "crates/apps/*",
    "crates/bin/*",
    "tests/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# Internal crates. Always depend on these through the workspace.
glass-types = { path = "crates/lib/types" }
glass-api = { path = "crates/lib/api" }
glass-policy = { path = "crates/lib/policy" }
glass-audit = { path = "crates/lib/audit" }
glass-rpc = { path = "crates/lib/rpc" }
glass-platform = { path = "crates/lib/platform" }
glass-agent-sdk = { path = "crates/lib/agent-sdk" }
glass-script = { path = "crates/lib/script" }
glass-replay = { path = "crates/lib/replay" }
glass-broker = { path = "crates/svc/broker" }
glass-tailoring = { path = "crates/svc/tailoring" }
glass-actions = { path = "crates/lib/actions" }
glass-first-party = { path = "crates/svc/first-party" }
glass-gateway = { path = "crates/svc/gateway" }
glass-gateway-providers = { path = "crates/svc/gateway-providers" }
glass-app-calendar = { path = "crates/apps/calendar" }
glass-app-files = { path = "crates/apps/files" }
glass-app-helpdesk = { path = "crates/apps/helpdesk" }
glass-app-mail = { path = "crates/apps/mail" }
glass-app-system = { path = "crates/apps/system" }
glass-app-hardware = { path = "crates/apps/hardware" }
glass-runtime = { path = "crates/svc/runtime" }
glass-managed = { path = "crates/lib/managed" }
glass-http = { path = "crates/lib/http" }
glass-crypto = { path = "crates/lib/crypto" }
glass-app-catalog = { path = "crates/apps/catalog" }
glass-app-studio = { path = "crates/apps/studio" }
glass-app-routines = { path = "crates/apps/routines" }
glass-app-people = { path = "crates/apps/people" }
glass-app-settings = { path = "crates/apps/settings" }
glass-app-chat = { path = "crates/apps/chat" }
glass-app-meet = { path = "crates/apps/meet" }
glass-app-artifacts = { path = "crates/apps/artifacts" }
glass-app-skills = { path = "crates/apps/skills" }
glass-app-docs = { path = "crates/apps/docs" }
glass-media-relay = { path = "crates/svc/media-relay" }
glass-agents-api = { path = "crates/lib/agents-api" }
glass-computers = { path = "crates/svc/computers" }
glass-teams = { path = "crates/svc/teams" }
glass-state = { path = "crates/lib/state" }

# Third-party crates. Licenses must pass `deny.toml` (no copyleft).
anyhow = "1.0.104"
# The script runner's JavaScript (ADR 0044): pure Rust, no default features
# (no Temporal, no Intl), about 30 s on a clean build.
boa_engine = { version = "0.22.0", default-features = false }
cap-std = "4.0.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
# Org signatures on managed settings (ADR 0023): verify on devices, sign in the
# console. No default features: no RNG, PEM or X25519, and no dependencies.
ed25519-compact = { version = "2.6.0", default-features = false, features = ["std"] }
hex = "0.4.3"
# HTTPS for the model gateway and the admin console (ADR 0018, 0023):
# responses parsed by httparse, TLS from the base system's OpenSSL and its
# trust store through native-tls. Only glass-gateway-providers may use them
# to leave the machine; httparse also reads requests to our small servers
# (glass-http: the app bridge in development, ADR 0024, and the console).
# OpenSSL itself is for glass-crypto's sealing too (ADR 0030), and for no
# other crate: tools/check-layers.py enforces both. (str0m, below, runs
# the meetings relay's DTLS on it.)
httparse = "1.10.1"
libc = "0.2.191"
# Mail (ADR 0037, EM0): reading what arrives (MIME, transfer encodings,
# every charset, HTML reduced to text) and building what glassd sends. The
# IMAP and SMTP clients are ours, in glass-gateway-providers.
mail-builder = { version = "1.0.0", default-features = false }
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
native-tls = "0.2.18"
openssl = "0.10.81"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
# TCP keepalive on the outbound HTTP client's connections (glass-gateway-
# providers), which std's TcpStream has no way to set. tokio has it in the
# tree already.
socket2 = { version = "0.6.5", features = ["all"] }
# The meetings relay (ADR 0030): WebRTC in Sans-IO style. Its DTLS and SRTP
# run on OpenSSL; only glass-media-relay may use it (tools/check-layers.py).
str0m = { version = "0.24.1", default-features = false, features = ["openssl"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "signal", "fs"] }
toml = "1.1.8"
tracing = "0.1.44"
# No `env-filter`: it pulls in `regex`; `filter::Targets` reads the same
# `target=level` syntax (docs/dev/build-performance.md).
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
# Docs and sheets (ADR 0035): Yjs documents on the computer, so agents read
# and edit what pages edit. Only glass-app-docs may use it.
yrs = "0.28.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

# Build speed (see docs/dev/build-performance.md).
#
# dev: full debug info for our crates, none for dependencies, and debug info
# left in the object files instead of copied into binaries: faster links and a
# smaller target/ without losing backtraces or breakpoints in our own code.
[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# SHA-256 over every chunk of an agent computer's disk and every S3 body:
# unoptimized, it holds a sleep to a few MB/s (ADR 0065 §11).
[profile.dev.package.sha2]
opt-level = 3

# The FreeBSD VM edit-deploy-test loop (`make vm-deploy`): optimized enough
# to behave like release, but incremental and without LTO so a one-crate
# change rebuilds in seconds. Never ship it.
[profile.vm]
inherits = "release"
lto = false
incremental = true
codegen-units = 256
opt-level = 1
# Keeps its symbols, for a backtrace in the VM (RUST_BACKTRACE=1).
strip = "debuginfo"

# The JavaScript engine (ADR 0044's scripts, ADR 0049's try-out of every
# app saved) interprets each line: at opt-level 1 a try of Mail takes 0.21 s
# natively against 0.15 s, and 3.3 s against 3.0 s in the emulated VM. It
# rarely changes, so its longer build is a one-off.
[profile.vm.package.boa_ast]
opt-level = 3
[profile.vm.package.boa_engine]
opt-level = 3
[profile.vm.package.boa_gc]
opt-level = 3
[profile.vm.package.boa_interner]
opt-level = 3
[profile.vm.package.boa_parser]
opt-level = 3
[profile.vm.package.boa_string]
opt-level = 3
[profile.vm.package.regress]
opt-level = 3

# What ships in images, 38% smaller than with symbols and 16 codegen units
# (docs/dev/build-performance.md): a panic still says what and where, and
# nothing ships with backtraces on. One codegen unit built as fast here.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
