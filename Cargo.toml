[workspace]
resolver = "3"
# Layering (enforced by `make check-layers`, see docs/repo-layout.md):
#   crates/lib  reusable libraries; may depend only on other lib crates
#   crates/svc  service implementations hosted by daemons; lib + svc
#   crates/bin  executables; anything
#   tests/*     end-to-end suites; anything
members = ["crates/lib/*", "crates/svc/*", "crates/bin/*", "tests/e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# Internal crates. Always depend on these through the workspace.
glass-types = { path = "crates/lib/types" }
glass-api = { path = "crates/lib/api" }
glass-policy = { path = "crates/lib/policy" }
glass-audit = { path = "crates/lib/audit" }
glass-rpc = { path = "crates/lib/rpc" }
glass-platform = { path = "crates/lib/platform" }
glass-agent-sdk = { path = "crates/lib/agent-sdk" }
glass-broker = { path = "crates/svc/broker" }
glass-actions = { path = "crates/svc/actions" }
glass-runtime = { path = "crates/svc/runtime" }

# Third-party crates. Licenses must pass `deny.toml` (no copyleft).
anyhow = "1.0.104"
cap-std = "4.0.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "signal", "fs"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
