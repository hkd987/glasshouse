# Dependency policy, enforced by `cargo deny check` (make deny).
#
# This is a closed-source product: third-party code must be under a
# permissive license. Copyleft (GPL, LGPL, AGPL, MPL, EUPL, SSPL...) is not
# allowed in anything we ship. See docs/dev/dependencies.md.

[graph]
targets = ["x86_64-unknown-freebsd", "x86_64-unknown-linux-gnu"]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The allow list is the policy, not an inventory of what's in use today.
unused-allowed-license = "allow"

# Our own crates are unpublished and carry the proprietary LICENSE.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are not wildcards in any meaningful sense.
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Crates their authors have retired, each brought in by something we depend
# on and none with a known vulnerability. A retired crate has no fixed
# version to move to: it leaves when the dependency that brings it does.
# Each is here with that dependency, so that `make advisories` fails on
# news (a vulnerability anywhere, or a newly retired crate to look at) and
# not on what has been looked at. Take an entry out when its crate is gone
# from the lockfile. This file is the desktop shell's too (shell/deny.toml
# links here), so each of the two workspaces is told of the other's entries
# as ones it didn't meet: a warning, not a failure.
ignore = [
    # The main workspace.
    { id = "RUSTSEC-2026-0215", reason = "smallstr, retired: from yrs (Docs' CRDT), through 0.28.1. Leaves when yrs drops it." },
    # The desktop shell.
    { id = "RUSTSEC-2026-0196", reason = "cgmath, retired: from smithay 0.7 (the compositor). Leaves with a smithay that drops it." },
    { id = "RUSTSEC-2024-0436", reason = "paste, retired: a macro used at build time by pixman, from smithay 0.7. Leaves with a pixman that drops it." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, retired: from fontdb, from cosmic-text 0.15 (iced 0.14's text). Leaves when cosmic-text moves to another font parser." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
